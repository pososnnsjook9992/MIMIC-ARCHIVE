<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARCHIVE SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
background-color: black;
color: #00ff88;
font-family: monospace;
padding: 20px;
overflow-x: hidden;
}

/* BOOT SCREEN */
#bootScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999999;
}

#bootLogo{
opacity:0;
width:300px;
transition:opacity 1s;
}

#bootText{
color:#00ff88;
margin-top:20px;
opacity:0;
font-size:18px;
letter-spacing:2px;
}

.bootFadeOut{
animation:bootFade 1s forwards;
}

@keyframes bootFade{
to{opacity:0;visibility:hidden;}
}

/* NORMAL UI */
button {
background: black;
color: #00ff88;
border: 1px solid #00ff88;
padding: 8px 12px;
cursor: pointer;
margin: 5px;
}

.notice { color: yellow; }
.glitch { color: red; }
.hidden { display: none; }

.fileGrid {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 10px;
}

.fileCard {
border: 1px solid #00ff88;
padding: 10px;
text-align: center;
cursor: pointer;
}

.fileImg {
width: 100%;
height: 60px;
margin-bottom: 5px;
background-color: #222;
background-size: cover;
background-position: center;
}

/* STRONG SHAKE */
@keyframes shake {
0% { transform: translate(0,0); }
20% { transform: translate(-25px, 15px); }
40% { transform: translate(30px, -20px); }
60% { transform: translate(-20px, 25px); }
80% { transform: translate(20px, -15px); }
100% { transform: translate(0,0); }
}
.shake { animation: shake 0.15s infinite; }

#flashContainer {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
}

.flashText {
position: absolute;
font-size: 26px;
color: red;
animation: flashColors 0.6s;
}

@keyframes flashColors {
0% { opacity: 1; }
50% { opacity: 0.3; }
100% { opacity: 1; }
}

#overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.85);
display: none;
justify-content: center;
align-items: center;
}

.fileWindow {
width: 600px;
background: black;
border: 2px solid #00ff88;
padding: 15px;
}

.fileTop {
display: flex;
gap: 10px;
}

.filePortrait {
width: 120px;
height: 120px;
background: #333;
background-size: cover;
background-position: center;
}

.fileInfo { font-size: 12px; }

.fileBottom {
margin-top: 10px;
border-top: 1px solid #00ff88;
padding-top: 10px;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="bootScreen">
<img id="bootLogo" src="Images/Misc/logo.png">
<div id="bootText">LOADING ARCHIVE...</div>
</div>
<audio id="bootSound" src="Sound/Misc/Startup.wav"></audio>

<h1>SECURE ARCHIVE SYSTEM</h1>
<p class="notice">TEST MODE ACTIVE</p>

<button onclick="toggleTime()">TOGGLE 8:30 MODE</button>
<button onclick="toggleMobileTest()">TOGGLE MOBILE TEST</button>

<hr>

<h2>ARCHIVE FILES</h2>
<div id="fileGrid" class="fileGrid"></div>

<h2>LOG FILES</h2>
<div id="logGrid" class="fileGrid"></div>

<hr>

<h2>RESTRICTED ACCESS</h2>
<div class="fileGrid">
<div class="fileCard" onclick="villainFile()">
<div class="fileImg" style="background-color:#550000"></div>
SUBJECT-00
</div>
</div>

<div id="variantSection" class="hidden">
<h2>VARIANT ARCHIVES</h2>
<div id="variantGrid" class="fileGrid"></div>
</div>

<hr>

<div id="terminal">
<p>ACCESS TERMINAL</p>
<input type="text" id="code" placeholder="ENTER CODE">
<button onclick="checkCode()">ENTER</button>
<p id="response"></p>
</div>

<div id="overlay" onclick="closeFile()">
<div class="fileWindow" onclick="event.stopPropagation()">
<div class="fileTop">
<div class="filePortrait" id="filePortrait"></div>
<div class="fileInfo" id="fileInfo"></div>
</div>
<div class="fileBottom" id="fileDesc"></div>
</div>
</div>

<div id="flashContainer"></div>

<script>
let force830=false;
let unlockedVariants=false;
let codeUnlocked=false;
let mobileTestMode=false;

/* BOOT SEQUENCE */
function bootSequence(){
const boot=document.getElementById("bootScreen");
const logo=document.getElementById("bootLogo");
const text=document.getElementById("bootText");
const sound=document.getElementById("bootSound");

setTimeout(()=>{
logo.style.opacity=1;

sound.volume=0.7;
sound.play().catch(()=>{});

setTimeout(()=>{
text.style.opacity=1;
},500);

setTimeout(()=>{
boot.classList.add("bootFadeOut");

setTimeout(()=>{
boot.style.display="none";
},1000);

},2000);

},1000);
}

/* MOBILE */
function toggleMobileTest(){
mobileTestMode=!mobileTestMode;
alert("Mobile Test Mode: "+mobileTestMode);
}
function isMobile(){
return mobileTestMode || /Mobi|Android|iPhone/i.test(navigator.userAgent);
}

/* DATA */
const files=[
{id:'s1',name:'SUBJECT-01',img:'Images/Profiles/s1.png',age:19,height:"5'11",status:"Alive",threat:"Medium",desc:'Adaptive subject instability detected.'},
{id:'s2',name:'SUBJECT-02',img:'Images/Profiles/s2.png',age:21,height:"6\'0",status:"Stable",threat:"Low",desc:'Behavior consistent.'},
{id:'s3',name:'SUBJECT-03',img:'Images/Profiles/s3.png',age:18,height:"5\'9",status:"Hostile",threat:"High",desc:'Aggressive subject.'}
];

const logs=[
{id:'log1',name:'LOG-01',color:'#333333',desc:'Multiverse test initiated.'},
{id:'log2',name:'LOG-02',color:'#111111',desc:'System instability detected.'}
];

const variants=[
{id:'v1',name:'VARIANT-01',img:'Images/Profiles/v1.png',status:'Unstable',threat:'Extreme',desc:'Multiverse instability detected.'},
{id:'v2',name:'VARIANT-02',img:'Images/Profiles/v2.png',status:'Hostile',threat:'Extreme',desc:'Highly aggressive variant.'}
];

/* RENDER */
function render(){
fileGrid.innerHTML="";
logGrid.innerHTML="";

files.forEach(f=>{
let d=document.createElement("div");
d.className="fileCard";
d.innerHTML=`<div class="fileImg" style="background-image:url('${f.img}')"></div>${f.name}`;
d.onclick=()=>openFile(f);
fileGrid.appendChild(d);
});

logs.forEach(l=>{
let d=document.createElement("div");
d.className="fileCard";
d.innerHTML=`<div class="fileImg" style="background-color:${l.color}"></div>${l.name}`;
d.onclick=()=>openFile(l);
logGrid.appendChild(d);
});

if(unlockedVariants){
variantSection.classList.remove("hidden");
variantGrid.innerHTML="";
variants.forEach(v=>{
let d=document.createElement("div");
d.className="fileCard";
d.innerHTML=`<div class="fileImg" style="background-image:url('${v.img}')"></div>${v.name}`;
d.onclick=()=>openVariant(v);
variantGrid.appendChild(d);
});
}
}

/* FILE VIEW */
function openFile(f){
overlay.style.display="flex";
let img=f.img||"Images/THISISMEIAMME.png";
filePortrait.style.backgroundImage=`url('${img}')`;

fileInfo.innerHTML=`
<b>${f.name}</b><br>
Age: ${f.age||"UNKNOWN"}<br>
Height: ${f.height||"UNKNOWN"}<br>
Status: ${f.status||"UNKNOWN"}<br>
Threat: ${f.threat||"UNKNOWN"}
`;

fileDesc.innerText=f.desc||"No data.";
}

function openVariant(v){
overlay.style.display="flex";
filePortrait.style.backgroundImage=`url('${v.img}')`;

fileInfo.innerHTML=`
<b>${v.name}</b><br>
Status: ${v.status}<br>
Threat: ${v.threat}
`;

fileDesc.innerText=v.desc;
}

function closeFile(){overlay.style.display="none";}

/* EFFECTS */
function spawn830(){
let e=document.createElement("div");
e.className="flashText";
e.innerText="8:30 PM";
e.style.left=Math.random()*100+"%";
e.style.top=Math.random()*100+"%";
flashContainer.appendChild(e);
setTimeout(()=>e.remove(),800);
}

function trigger830Burst(){
for(let i=0;i<4;i++) setTimeout(spawn830,i*120);
}

/* CAR EVENT */
function showCar(){
if(isMobile()){
let flash=document.createElement("div");
flash.style.position="fixed";
flash.style.top=0;
flash.style.left=0;
flash.style.width="100%";
flash.style.height="100%";
flash.style.background="white";
flash.style.display="flex";
flash.style.alignItems="center";
flash.style.justifyContent="center";
flash.style.zIndex=99999;

flash.innerHTML=`<img src="Images/FIND/REGRET.png" style="max-width:80%">`;
document.body.appendChild(flash);
setTimeout(()=>flash.remove(),4000);

}else{
let w=window.open("", "_blank","width=400,height=300");
if(w){
w.document.write(`<body style="margin:0;background:white;display:flex;align-items:center;justify-content:center;height:100vh;">
<img src="Images/FIND/REGRET.png" style="max-width:80%">
</body>`);
}
}
}

/* VILLAIN */
function villainFile(){
if(!force830){
document.body.classList.add("shake");
setTimeout(()=>document.body.classList.remove("shake"),600);

trigger830Burst();

if(Math.random()<0.12) showCar();
return;
}

openFile({
name:"SUBJECT-00",
img:"Images/THISISMEIAMME.png",
status:"UNKNOWN",
threat:"???",
desc:"Only two were meant to exist."
});
}

/* CODE */
function checkCode(){
if(code.value==="PHASESHIFT2"){
codeUnlocked=true;
unlockedVariants=true;
render();
response.innerHTML="<p class='glitch'>ACCESS GRANTED</p>";
}else{
response.innerText="ACCESS DENIED";
}
}

function toggleTime(){force830=!force830;}

window.onload=()=>{
bootSequence();
render();
};
</script>

</body>
</html>
